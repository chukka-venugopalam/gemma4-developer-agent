name: Submission result
about: Record a Kaggle submission outcome and artifact identity
labels: [submission-result]
body:
  - type: input
    id: submission_ref
    attributes:
      label: Kaggle submission reference
  - type: input
    id: sha256
    attributes:
      label: Candidate ZIP SHA-256
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: Status
      placeholder: Succeeded / Kaggle Error / Notebook Timeout
    validations:
      required: true
  - type: input
    id: score
    attributes:
      label: Public score, if present
  - type: textarea
    id: logs
    attributes:
      label: Link to logs and notes
