agent_class: LlmAgent
name: gemma_swe_hybrid_v3
model: gemma-4-31b-it-qat-w4a16-ct
description: Adaptive software-engineering repair agent using targeted search, code graphs, focused investigation, minimal edits, and verification.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/investigator.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
