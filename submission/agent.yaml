agent_class: LlmAgent
name: gemma_swe_pack_graph_adaptive
model: gemma-4-31b-it-qat-w4a16-ct
description: >
  Adaptive SWE repair agent combining evidence-first localization, semantic and
  graph code intelligence, an optional read-only investigator for hard cases,
  minimal compatible patches, and layered verification.
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
  - agent_tool:
      config_path: sub_agents/investigator.yaml
      skip_summarization: true
generate_content_config: !include configs/sampling.yaml
